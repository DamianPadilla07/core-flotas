# 1. Configuración de conexión a SQL Server local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FlotasDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Flota2221
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Configuración de Hibernate (Crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect